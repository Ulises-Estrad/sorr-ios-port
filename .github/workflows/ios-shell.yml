name: iOS Shell

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ios-shell.yml"
      - "sorr-vita-master/cmake/ios/**"
      - "sorr-vita-master/core/bgdrtm/src/fmath.c"
      - "sorr-vita-master/core/bgdrtm/src/misc.c"
      - "sorr-vita-master/core/bgdrtm/src/strings.c"
      - "sorr-vita-master/core/bgdrtm/include/**"
      - "sorr-vita-master/core/include/**"
  pull_request:
    paths:
      - ".github/workflows/ios-shell.yml"
      - "sorr-vita-master/cmake/ios/**"
      - "sorr-vita-master/core/bgdrtm/src/fmath.c"
      - "sorr-vita-master/core/bgdrtm/src/misc.c"
      - "sorr-vita-master/core/bgdrtm/src/strings.c"
      - "sorr-vita-master/core/bgdrtm/include/**"
      - "sorr-vita-master/core/include/**"

concurrency:
  group: ios-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-shell-simulator:
    name: Build iOS shell for simulator arm64
    runs-on: macos-15
    timeout-minutes: 45

    env:
      SDL2_VERSION: "2.30.12"
      IOS_SIM_ARCH: "arm64"
      IOS_SHELL_BUILD_DIR: "build-ios-shell-sim"
      ARTIFACT_DIR: "ci-artifacts/ios-shell"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against bundled game assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/logs"
          {
            echo "Checking checkout for game assets that must not be committed or uploaded..."
            matches="$(find . \
              \( -name 'SorR.dat' \
                -o -path './sorr-vita-master/data' \
                -o -path './sorr-vita-master/data/*' \
                -o -name '*.fpg' \
                -o -name '*.wav' \
                -o -name '*.ogg' \
                -o -name '*.smk' \
                -o -name '*.png' \) \
              -not -path './.git/*' \
              -not -path './ci-artifacts/*' \
              -print | head -n 20)"
            if [[ -n "$matches" ]]; then
              echo "::error::Game assets are present in the checkout. Remove them from the repository before running the iOS shell workflow."
              echo "$matches"
              exit 1
            fi
            echo "No prohibited game assets found in checkout."
          } 2>&1 | tee "$ARTIFACT_DIR/logs/asset-guard.log"

      - name: Print tool versions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## sw_vers"
            sw_vers
            echo
            echo "## uname -a"
            uname -a
            echo
            echo "## xcodebuild -version"
            xcodebuild -version
            echo
            echo "## iphonesimulator SDK"
            xcrun --sdk iphonesimulator --show-sdk-path
            echo
            echo "## cmake --version"
            cmake --version
          } 2>&1 | tee "$ARTIFACT_DIR/logs/tool-versions.log"

      - name: Fetch SDL2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdl2-src" "$ARTIFACT_DIR/logs"
          SDL2_TARBALL="$RUNNER_TEMP/SDL2-${SDL2_VERSION}.tar.gz"
          {
            echo "Downloading SDL2 ${SDL2_VERSION}"
            curl -L --fail --retry 3 \
              "https://www.libsdl.org/release/SDL2-${SDL2_VERSION}.tar.gz" \
              -o "$SDL2_TARBALL"
            tar -xzf "$SDL2_TARBALL" -C "$RUNNER_TEMP/sdl2-src" --strip-components=1
            echo "SDL2 source extracted to $RUNNER_TEMP/sdl2-src"
          } 2>&1 | tee "$ARTIFACT_DIR/logs/sdl2-fetch.log"

      - name: Configure SDL2 for iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          SDL2_PREFIX="$GITHUB_WORKSPACE/_deps/sdl2-ios-sim"
          {
            mkdir -p "$GITHUB_WORKSPACE/_deps"
            echo "SDL2_IOS_PREFIX=$SDL2_PREFIX" >> "$GITHUB_ENV"
            echo "Installing SDL2 to $SDL2_PREFIX"
            cmake -S "$RUNNER_TEMP/sdl2-src" \
              -B "$RUNNER_TEMP/sdl2-build-sim" \
              -G Xcode \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT=iphonesimulator \
              -DCMAKE_OSX_ARCHITECTURES="$IOS_SIM_ARCH" \
              -DCMAKE_INSTALL_PREFIX="$SDL2_PREFIX" \
              -DSDL_STATIC=ON \
              -DSDL_SHARED=OFF \
              -DSDL_TEST=OFF
          } 2>&1 | tee "$ARTIFACT_DIR/logs/sdl2-configure.log"

      - name: Build and install SDL2 for iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          {
            cmake --build "$RUNNER_TEMP/sdl2-build-sim" \
              --config Release \
              -- \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO
            cmake --install "$RUNNER_TEMP/sdl2-build-sim" --config Release
            echo "Installed SDL2 prefix:"
            find "$SDL2_IOS_PREFIX" -maxdepth 5 -print | sort
          } 2>&1 | tee "$ARTIFACT_DIR/logs/sdl2-build-install.log"

      - name: Configure iOS shell
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          {
            echo "SDL2_IOS_PREFIX=$SDL2_IOS_PREFIX"
            echo "SDL2 discovery debug:"
            find "$GITHUB_WORKSPACE/_deps" -maxdepth 5 \
              \( -name "SDL2.framework" -o -name "libSDL2*.a" -o -name "SDL.h" \) \
              -print | sort
            cmake -S sorr-vita-master/cmake/ios \
              -B "$IOS_SHELL_BUILD_DIR" \
              -G Xcode \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT=iphonesimulator \
              -DCMAKE_OSX_ARCHITECTURES="$IOS_SIM_ARCH" \
              -DCMAKE_PREFIX_PATH="$SDL2_IOS_PREFIX" \
              -DSORR_IOS_SDL2_ROOT="$SDL2_IOS_PREFIX" \
              -DSORR_IOS_BUNDLE_IDENTIFIER="dev.local.sorr.iosshell.ci"
          } 2>&1 | tee "$ARTIFACT_DIR/logs/ios-shell-configure.log"

      - name: Build iOS shell for simulator
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          {
            cmake --build "$IOS_SHELL_BUILD_DIR" \
              --config Debug \
              -- \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="-"
          } 2>&1 | tee "$ARTIFACT_DIR/logs/ios-shell-build.log"

      - name: Launch iOS shell in simulator
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          mkdir -p "$ARTIFACT_DIR/logs/simulator"
          LOG_STREAM_PID=""
          cleanup() {
            if [[ -n "$LOG_STREAM_PID" ]] && kill -0 "$LOG_STREAM_PID" 2>/dev/null; then
              kill "$LOG_STREAM_PID" 2>/dev/null || true
              wait "$LOG_STREAM_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          {
            echo "Available simulator devices:"
            xcrun simctl list devices available

            DEVICE_UDID="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; data=json.load(sys.stdin); candidates=[device.get("udid", "") for runtime, devices in data.get("devices", {}).items() if "iOS" in runtime for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]; print(candidates[0] if candidates else "")')"
            if [[ -z "$DEVICE_UDID" ]]; then
              echo "::error::No available iPhone simulator was found."
              exit 1
            fi
            echo "Selected simulator UDID: $DEVICE_UDID"
            echo "Resetting selected simulator to clear stale install placeholders..."
            xcrun simctl shutdown "$DEVICE_UDID" || true
            xcrun simctl erase "$DEVICE_UDID"

            APP_PATH="$(find "$IOS_SHELL_BUILD_DIR" -name 'SorrIOSShell.app' -type d | head -n 1 || true)"
            if [[ -z "$APP_PATH" ]]; then
              echo "::error::SorrIOSShell.app was not produced."
              exit 1
            fi
            echo "App path: $APP_PATH"
            echo "Info.plist:"
            plutil -p "$APP_PATH/Info.plist"
            echo "App bundle tree:"
            find "$APP_PATH" -maxdepth 3 -print | sort

            BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
            echo "Bundle id: $BUNDLE_ID"
            echo "Launch screen dictionary: $(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$APP_PATH/Info.plist" 2>/dev/null || echo '(missing)')"
            echo "Supported orientations: $(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "$APP_PATH/Info.plist" 2>/dev/null || echo '(missing)')"
            echo "Verifying Xcode-produced simulator app signature"
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            /usr/bin/codesign --display --verbose=4 "$APP_PATH" 2>&1 || true

            xcrun simctl boot "$DEVICE_UDID" || true
            xcrun simctl bootstatus "$DEVICE_UDID" -b
            open -a Simulator --args -CurrentDeviceUDID "$DEVICE_UDID" || true
            sleep 5

            echo "Removing any stale app registration before install..."
            xcrun simctl uninstall "$DEVICE_UDID" "$BUNDLE_ID" || true
            xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
            echo "Installed app container:"
            xcrun simctl get_app_container "$DEVICE_UDID" "$BUNDLE_ID" app || true
            echo "Installed app metadata:"
            xcrun simctl listapps "$DEVICE_UDID" | grep -A 40 "$BUNDLE_ID" || true
            echo "Waiting for SpringBoard/LaunchServices app registration to settle..."
            sleep 10

            LOG_STREAM="$ARTIFACT_DIR/logs/simulator/sorr-ios-shell-log-stream.log"
            LOG_SHOW="$ARTIFACT_DIR/logs/simulator/sorr-ios-shell-log-show.log"
            SYSTEM_LOG_SHOW="$ARTIFACT_DIR/logs/simulator/sorr-ios-shell-system-log-show.log"
            HOST_LOG_SHOW="$ARTIFACT_DIR/logs/simulator/sorr-ios-shell-host-coresimulator-log-show.log"
            LAUNCH_LOG="$ARTIFACT_DIR/logs/simulator/simctl-launch.log"
            LAUNCH_CMD_LOG="$ARTIFACT_DIR/logs/simulator/simctl-launch-command.log"
            STDOUT_LOG="$ARTIFACT_DIR/logs/simulator/sorr-ios-shell-stdout.log"
            STDERR_LOG="$ARTIFACT_DIR/logs/simulator/sorr-ios-shell-stderr.log"
            COMBINED_LOG="$ARTIFACT_DIR/logs/simulator/sorr-ios-shell-combined.log"
            touch "$STDOUT_LOG" "$STDERR_LOG" "$LAUNCH_LOG" "$LAUNCH_CMD_LOG"

            xcrun simctl spawn "$DEVICE_UDID" log stream \
              --style compact \
              --level debug \
              --predicate 'process == "SorrIOSShell" OR eventMessage CONTAINS "SORR iOS shell"' \
              > "$LOG_STREAM" 2>&1 &
            LOG_STREAM_PID="$!"
            sleep 2

            LAUNCH_EXIT=1
            LAUNCH_ATTEMPTS=4
            for attempt in $(seq 1 "$LAUNCH_ATTEMPTS"); do
              echo "simctl launch attempt $attempt/$LAUNCH_ATTEMPTS" | tee -a "$LAUNCH_LOG"
              : > "$STDOUT_LOG"
              : > "$STDERR_LOG"
              : > "$LAUNCH_CMD_LOG"
              set +e
              xcrun simctl launch \
                --terminate-running-process \
                "$DEVICE_UDID" \
                "$BUNDLE_ID" > "$LAUNCH_CMD_LOG" 2>&1 &
              SIMCTL_LAUNCH_PID="$!"
              LAUNCH_EXIT=""
              for launch_wait in $(seq 1 20); do
                if ! kill -0 "$SIMCTL_LAUNCH_PID" 2>/dev/null; then
                  wait "$SIMCTL_LAUNCH_PID"
                  LAUNCH_EXIT="$?"
                  break
                fi
                sleep 1
              done
              if [[ -z "$LAUNCH_EXIT" ]]; then
                echo "simctl launch still running after 20s; stopping attached launch command and continuing to marker checks" | tee -a "$LAUNCH_LOG"
                kill "$SIMCTL_LAUNCH_PID" 2>/dev/null || true
                wait "$SIMCTL_LAUNCH_PID" 2>/dev/null || true
                LAUNCH_EXIT=0
              fi
              cat "$LAUNCH_CMD_LOG" | tee -a "$LAUNCH_LOG"
              set -e
              echo "simctl launch attempt $attempt exit code: $LAUNCH_EXIT" | tee -a "$LAUNCH_LOG"
              if [[ "$LAUNCH_EXIT" -eq 0 ]]; then
                break
              fi
              if [[ "$attempt" -lt "$LAUNCH_ATTEMPTS" ]]; then
                xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" || true
                echo "Installed app metadata after failed attempt $attempt:"
                xcrun simctl listapps "$DEVICE_UDID" | grep -A 40 "$BUNDLE_ID" || true
                sleep $((attempt * 10))
              fi
            done
            sleep 20

            xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" || true
            sleep 2
            cleanup
            LOG_STREAM_PID=""

            xcrun simctl spawn "$DEVICE_UDID" log show \
              --last 2m \
              --style compact \
              --predicate 'process == "SorrIOSShell" OR eventMessage CONTAINS "SORR iOS shell"' \
              > "$LOG_SHOW" 2>&1 || true
            xcrun simctl spawn "$DEVICE_UDID" log show \
              --last 3m \
              --style compact \
              --predicate 'process IN {"SpringBoard", "runningboardd", "launchservicesd", "installd", "backboardd"} OR subsystem CONTAINS "FrontBoard" OR subsystem CONTAINS "RunningBoard" OR subsystem CONTAINS "LaunchServices" OR eventMessage CONTAINS "dev.local.sorr.iosshell.ci" OR composedMessage CONTAINS "dev.local.sorr.iosshell.ci" OR eventMessage CONTAINS "SorrIOSShell" OR composedMessage CONTAINS "SorrIOSShell"' \
              > "$SYSTEM_LOG_SHOW" 2>&1 || true
            HOST_LOG_PREDICATE="process == \"CoreSimulatorService\" OR subsystem CONTAINS \"CoreSimulator\" OR eventMessage CONTAINS \"$BUNDLE_ID\" OR composedMessage CONTAINS \"$BUNDLE_ID\" OR eventMessage CONTAINS \"SBMainWorkspace\" OR composedMessage CONTAINS \"SBMainWorkspace\" OR eventMessage CONTAINS \"FBSOpenApplication\" OR composedMessage CONTAINS \"FBSOpenApplication\" OR eventMessage CONTAINS \"SorrIOSShell\" OR composedMessage CONTAINS \"SorrIOSShell\""
            log show \
              --last 5m \
              --style compact \
              --predicate "$HOST_LOG_PREDICATE" \
              > "$HOST_LOG_SHOW" 2>&1 || true

            {
              echo "===== simctl launch ====="
              cat "$LAUNCH_LOG" || true
              echo
              echo "===== app stdout ====="
              cat "$STDOUT_LOG" || true
              echo
              echo "===== app stderr ====="
              cat "$STDERR_LOG" || true
              echo
              echo "===== log stream ====="
              cat "$LOG_STREAM" || true
              echo
              echo "===== log show ====="
              cat "$LOG_SHOW" || true
              echo
              echo "===== system log show ====="
              cat "$SYSTEM_LOG_SHOW" || true
              echo
              echo "===== host CoreSimulator log show ====="
              cat "$HOST_LOG_SHOW" || true
            } > "$COMBINED_LOG"

            echo "Combined simulator log:"
            cat "$COMBINED_LOG"

            if [[ "$LAUNCH_EXIT" -ne 0 ]]; then
              {
                echo "simctl launch failed with exit code $LAUNCH_EXIT"
                echo
                echo "Last simctl launch lines:"
                tail -n 80 "$LAUNCH_LOG" || true
                echo
                echo "Last host CoreSimulator lines mentioning the bundle:"
                grep -E "$BUNDLE_ID|SorrIOSShell|SBMainWorkspace|FBSOpenApplication|Launch failed|RequestDenied" "$HOST_LOG_SHOW" | tail -n 80 || true
                echo
                echo "Last in-simulator system lines mentioning the bundle:"
                grep -E "$BUNDLE_ID|SorrIOSShell|SBMainWorkspace|FBSOpenApplication|Launch failed|RequestDenied" "$SYSTEM_LOG_SHOW" | tail -n 80 || true
              } > "$ARTIFACT_DIR/logs/simulator/launch-failure-summary.log"
              echo "::error title=simctl launch failed::$(tr '\n' ' ' < "$ARTIFACT_DIR/logs/simulator/launch-failure-summary.log" | cut -c 1-900)"
              echo "::error::simctl launch failed with exit code $LAUNCH_EXIT"
              exit "$LAUNCH_EXIT"
            fi

            required_markers=(
              "SORR iOS shell: app entry"
              "SORR iOS shell: SDL_Init ok"
              "SORR iOS shell: SDL video/events/timer init ok"
              "SORR iOS shell: bundle root path="
              "SORR iOS shell: support root path="
              "SORR iOS shell: D2 file sharing import path="
              "SORR iOS shell: savegame dir created"
              "SORR iOS shell: xbox dir created"
              "SORR iOS shell: logs dir created"
              "SORR iOS shell: data layout test file write/read ok"
              "SORR iOS shell: D2 waiting for data import path="
              "SORR iOS shell: D2 probe log write/read ok"
              "SORR iOS shell: SDL_CreateWindow success"
              "SORR iOS shell: SDL_CreateRenderer success"
              "SORR iOS shell: reached D2 runtime skip probe"
              "SORR iOS shell: Bennu runtime intentionally skipped in D2"
              "SORR iOS shell: SorR.dat intentionally not loaded or executed in D2"
              "SORR iOS shell: entering responsive idle loop"
            )
            for marker in "${required_markers[@]}"; do
              if ! grep -Fq "$marker" "$COMBINED_LOG"; then
                echo "::error::Missing simulator log marker: $marker"
                exit 1
              fi
            done

            echo "iOS shell simulator launch proof passed."
          } 2>&1 | tee "$ARTIFACT_DIR/logs/ios-shell-simulator-launch.log"

      - name: Package iOS shell artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/build-products"
          {
            echo "Searching for SorrIOSShell.app"
            APP_PATH="$(find "$IOS_SHELL_BUILD_DIR" -name 'SorrIOSShell.app' -type d | head -n 1 || true)"
            if [[ -n "$APP_PATH" ]]; then
              echo "Found app: $APP_PATH"
              ditto -c -k --keepParent "$APP_PATH" "$ARTIFACT_DIR/build-products/SorrIOSShell-iphonesimulator-${IOS_SIM_ARCH}.zip"
              find "$APP_PATH" -maxdepth 3 -type f | sort
            else
              echo "SorrIOSShell.app was not produced."
            fi
          } 2>&1 | tee "$ARTIFACT_DIR/logs/package-artifacts.log"

      - name: Upload iOS shell logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shell-simulator-arm64
          path: ci-artifacts/ios-shell
          if-no-files-found: warn
          retention-days: 14

  ios-shell-device-unsigned:
    name: Build iOS shell unsigned IPA for device arm64
    runs-on: macos-15
    timeout-minutes: 45

    env:
      SDL2_VERSION: "2.30.12"
      IOS_DEVICE_ARCH: "arm64"
      IOS_DEVICE_BUILD_DIR: "build-ios-shell-device"
      ARTIFACT_DIR: "ci-artifacts/ios-shell-device"
      IPA_NAME: "SorrIOSShell-d2-data-import-adhoc.ipa"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against bundled game assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/logs"
          {
            echo "Checking checkout for game assets that must not be committed or uploaded..."
            matches="$(find . \
              \( -name 'SorR.dat' \
                -o -path './sorr-vita-master/data' \
                -o -path './sorr-vita-master/data/*' \
                -o -name '*.fpg' \
                -o -name '*.wav' \
                -o -name '*.ogg' \
                -o -name '*.smk' \
                -o -name '*.png' \) \
              -not -path './.git/*' \
              -not -path './ci-artifacts/*' \
              -print | head -n 20)"
            if [[ -n "$matches" ]]; then
              echo "::error::Game assets are present in the checkout. Remove them from the repository before running the iOS shell workflow."
              echo "$matches"
              exit 1
            fi
            echo "No prohibited game assets found in checkout."
          } 2>&1 | tee "$ARTIFACT_DIR/logs/asset-guard.log"

      - name: Print device build tool versions
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## sw_vers"
            sw_vers
            echo
            echo "## uname -a"
            uname -a
            echo
            echo "## xcodebuild -version"
            xcodebuild -version
            echo
            echo "## iphoneos SDK"
            xcrun --sdk iphoneos --show-sdk-path
            echo
            echo "## cmake --version"
            cmake --version
          } 2>&1 | tee "$ARTIFACT_DIR/logs/tool-versions.log"

      - name: Fetch SDL2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdl2-src" "$ARTIFACT_DIR/logs"
          SDL2_TARBALL="$RUNNER_TEMP/SDL2-${SDL2_VERSION}.tar.gz"
          {
            echo "Downloading SDL2 ${SDL2_VERSION}"
            curl -L --fail --retry 3 \
              "https://www.libsdl.org/release/SDL2-${SDL2_VERSION}.tar.gz" \
              -o "$SDL2_TARBALL"
            tar -xzf "$SDL2_TARBALL" -C "$RUNNER_TEMP/sdl2-src" --strip-components=1
            echo "SDL2 source extracted to $RUNNER_TEMP/sdl2-src"
          } 2>&1 | tee "$ARTIFACT_DIR/logs/sdl2-fetch.log"

      - name: Configure SDL2 for iOS device
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          SDL2_PREFIX="$GITHUB_WORKSPACE/_deps/sdl2-ios-device"
          {
            mkdir -p "$GITHUB_WORKSPACE/_deps"
            echo "SDL2_IOS_DEVICE_PREFIX=$SDL2_PREFIX" >> "$GITHUB_ENV"
            echo "Installing SDL2 to $SDL2_PREFIX"
            cmake -S "$RUNNER_TEMP/sdl2-src" \
              -B "$RUNNER_TEMP/sdl2-build-device" \
              -G Xcode \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT=iphoneos \
              -DCMAKE_OSX_ARCHITECTURES="$IOS_DEVICE_ARCH" \
              -DCMAKE_INSTALL_PREFIX="$SDL2_PREFIX" \
              -DSDL_STATIC=ON \
              -DSDL_SHARED=OFF \
              -DSDL_TEST=OFF
          } 2>&1 | tee "$ARTIFACT_DIR/logs/sdl2-configure.log"

      - name: Build and install SDL2 for iOS device
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          {
            cmake --build "$RUNNER_TEMP/sdl2-build-device" \
              --config Release \
              -- \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO
            cmake --install "$RUNNER_TEMP/sdl2-build-device" --config Release
            echo "Installed SDL2 device prefix:"
            find "$SDL2_IOS_DEVICE_PREFIX" -maxdepth 5 -print | sort
          } 2>&1 | tee "$ARTIFACT_DIR/logs/sdl2-build-install.log"

      - name: Configure iOS shell device build
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          {
            echo "SDL2_IOS_DEVICE_PREFIX=$SDL2_IOS_DEVICE_PREFIX"
            echo "SDL2 device discovery debug:"
            find "$GITHUB_WORKSPACE/_deps" -maxdepth 5 \
              \( -name "SDL2.framework" -o -name "libSDL2*.a" -o -name "SDL.h" \) \
              -print | sort
            cmake -S sorr-vita-master/cmake/ios \
              -B "$IOS_DEVICE_BUILD_DIR" \
              -G Xcode \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT=iphoneos \
              -DCMAKE_OSX_ARCHITECTURES="$IOS_DEVICE_ARCH" \
              -DCMAKE_PREFIX_PATH="$SDL2_IOS_DEVICE_PREFIX" \
              -DSORR_IOS_SDL2_ROOT="$SDL2_IOS_DEVICE_PREFIX" \
              -DSORR_IOS_BUNDLE_IDENTIFIER="dev.local.sorr.iosshell"
          } 2>&1 | tee "$ARTIFACT_DIR/logs/ios-shell-configure.log"

      - name: Build unsigned iOS shell app for device
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          {
            cmake --build "$IOS_DEVICE_BUILD_DIR" \
              --config Release \
              -- \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO
          } 2>&1 | tee "$ARTIFACT_DIR/logs/ios-shell-build.log"

      - name: Package unsigned device IPA
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          {
            APP_PATH="$(find "$IOS_DEVICE_BUILD_DIR" -path '*Release-iphoneos/SorrIOSShell.app' -type d | head -n 1 || true)"
            if [[ -z "$APP_PATH" ]]; then
              APP_PATH="$(find "$IOS_DEVICE_BUILD_DIR" -name 'SorrIOSShell.app' -type d | head -n 1 || true)"
            fi
            if [[ -z "$APP_PATH" ]]; then
              echo "::error::SorrIOSShell.app was not produced for iphoneos."
              exit 1
            fi

            echo "Device app path: $APP_PATH"
            echo "Info.plist:"
            plutil -p "$APP_PATH/Info.plist"
            echo "Device app bundle tree:"
            find "$APP_PATH" -maxdepth 3 -print | sort
            echo "Executable architecture:"
            lipo -info "$APP_PATH/SorrIOSShell"
            echo "Code signature display before ad-hoc signing:"
            codesign --display --verbose=4 "$APP_PATH" 2>&1 || true
            echo "Applying ad-hoc signature for Sideloadly-friendly IPA packaging"
            codesign --force --sign - --timestamp=none "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            codesign --display --verbose=4 "$APP_PATH" 2>&1 || true

            IPA_STAGE="$RUNNER_TEMP/sorr-ios-device-ipa"
            IPA_INSPECT="$RUNNER_TEMP/sorr-ios-device-ipa-inspect"
            rm -rf "$IPA_STAGE"
            rm -rf "$IPA_INSPECT"
            mkdir -p "$IPA_STAGE/Payload" "$ARTIFACT_DIR/build-products"
            cp -R "$APP_PATH" "$IPA_STAGE/Payload/"

            (cd "$IPA_STAGE" && zip -qry "$GITHUB_WORKSPACE/$ARTIFACT_DIR/build-products/$IPA_NAME" Payload)
            echo "Created IPA: $ARTIFACT_DIR/build-products/$IPA_NAME"
            unzip -l "$ARTIFACT_DIR/build-products/$IPA_NAME" | tee "$ARTIFACT_DIR/logs/ipa-contents.log"
            unzip -q "$ARTIFACT_DIR/build-products/$IPA_NAME" -d "$IPA_INSPECT"
            echo "Inspected IPA tree:"
            find "$IPA_INSPECT" -maxdepth 4 -print | sort
            echo "Inspected IPA Info.plist:"
            plutil -p "$IPA_INSPECT/Payload/SorrIOSShell.app/Info.plist"
            echo "Inspected IPA executable:"
            file "$IPA_INSPECT/Payload/SorrIOSShell.app/SorrIOSShell"
            lipo -info "$IPA_INSPECT/Payload/SorrIOSShell.app/SorrIOSShell"
            echo "Inspected IPA code signature:"
            codesign -dv "$IPA_INSPECT/Payload/SorrIOSShell.app" 2>&1 || true

            forbidden="$(unzip -l "$ARTIFACT_DIR/build-products/$IPA_NAME" | awk '{print $4}' | grep -E '(^|/)SorR\.dat$|(^|/)data/|\.fpg$|\.wav$|\.ogg$|\.smk$|\.png$' || true)"
            if [[ -n "$forbidden" ]]; then
              echo "::error::Forbidden game data/assets were packaged into the IPA."
              echo "$forbidden"
              exit 1
            fi
            echo "IPA inspection passed: no SorR.dat, data/, FPG, WAV, OGG, SMK, or PNG content."
            test -d "$IPA_INSPECT/Payload/SorrIOSShell.app"
            test -x "$IPA_INSPECT/Payload/SorrIOSShell.app/SorrIOSShell"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$IPA_INSPECT/Payload/SorrIOSShell.app/Info.plist" | grep -Fx 'SorrIOSShell'
            /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$IPA_INSPECT/Payload/SorrIOSShell.app/Info.plist" | grep -Fx 'APPL'
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$IPA_INSPECT/Payload/SorrIOSShell.app/Info.plist" | grep -E '^[A-Za-z0-9.-]+$'
            /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$IPA_INSPECT/Payload/SorrIOSShell.app/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$IPA_INSPECT/Payload/SorrIOSShell.app/Info.plist" | grep -Fx '1'
            /usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$IPA_INSPECT/Payload/SorrIOSShell.app/Info.plist" | grep -Fx 'true'
            /usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$IPA_INSPECT/Payload/SorrIOSShell.app/Info.plist" | grep -Fx 'true'
            lipo -info "$IPA_INSPECT/Payload/SorrIOSShell.app/SorrIOSShell" | grep -F 'arm64'
            codesign --verify --deep --strict --verbose=2 "$IPA_INSPECT/Payload/SorrIOSShell.app"
          } 2>&1 | tee "$ARTIFACT_DIR/logs/package-unsigned-ipa.log"

      - name: Upload unsigned device IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shell-d2-data-import-device-arm64
          path: ci-artifacts/ios-shell-device
          if-no-files-found: warn
          retention-days: 14
